contenido:
  competencia_general: >-
    Determinar los requerimientos de información, mediante el análisis de los procesos, problemas y áreas de oportunidad
    organizacionales, para proponer alternativas de solución que resuelvan y anticipen problemáticas de procesos, con responsabilidad,
    honestidad y actitud organizada.

  proposito_general: >-
    La unidad de aprendizaje aborda el análisis del entorno, procesos y datos de la organización, lo que permite identificar
    problemáticas existentes y así proponer alternativas de solución con base al modelado de datos.

    Se ubica en la etapa básica, es de carácter obligatoria, y forma parte del área de Ciencia de Datos del programa educativo de
    Inteligencia de Negocios. La modalidad semipresencial articula las sesiones de análisis con actividades de modelado,
    documentación y retroalimentación en Blackboard.

  estrategia_general: >-
    Se utiliza el aprendizaje basado en casos, ejercicios prácticos de modelado y un proyecto integrador. El docente presentará
    conceptos, demostrará herramientas y retroalimentará las prácticas. El estudiante investigará, analizará casos, elaborará
    modelos y reportes, y desarrollará colaborativamente una propuesta de solución; las actividades virtuales se organizarán en
    Blackboard.

  evidencias_desempeno: >-
    Propuesta de solución estandarizada que integre los análisis del entorno, procesos y datos de la organización, especificando los
    requerimientos de información identificados.

  criterios_evaluacion: >-
    Cada meta contiene los criterios específicos con los que se revisará la evidencia correspondiente. La evaluación considera la
    claridad del análisis, la congruencia del modelo con los requerimientos identificados, la documentación de los datos y la
    pertinencia de la alternativa de solución.

  autores_pua: >-
    Claudia Viviana Álvarez Vega, Emma Sofia Castillejos Caballero, María del Consuelo Salgado Soto y Eva Olivia Martínez Lucero.
    12 de noviembre de 2020.

unidades:
  - numero: "I"
    nombre: "Análisis organizacional"
    duracion_horas: 8
    competencia: >-
      Distinguir la problemática, áreas de oportunidad y procesos de la organización, mediante el análisis del entorno, para
      especificar los requerimientos de datos e información, con compromiso, responsabilidad y honestidad.
    temas:
      - "1.1 . Análisis del entorno"
      - "1.1.1. Naturaleza de la organización"
      - "1.1.2. Áreas funcionales"
      - "1.1.3. Identificación de las necesidades y requerimientos información"
      - "1.1.4. Análisis de políticas y estrategias"
      - "1.1.5. Legislación de los datos"
      - "1.2. Estudio preliminar"
      - "1.2.1. Identificación de las reglas y necesidades del negocio"
      - "1.2.2. Identificación inicial de requerimientos"
      - "1.2.3. Técnicas para la identificación de requerimientos"
      - "1.2.4. Perfilado de datos (Data profiling) Fuentes internas, externas"
      - "1.2.5. Identificación de necesidades de integración de datos (sincronización de datos)"
      - "1.2.6. Oportunidad y jerarquización de los datos"
      - "1.2.7. Consolidación de datos"

  - numero: "II"
    nombre: "Análisis de procesos"
    duracion_horas: 8
    competencia: >-
      Analizar los componentes de los procesos, mediante el uso de herramientas y el lenguaje de modelado, para desarrollar la
      especificación de los modelos que cumplen con los requerimientos, con creatividad, actitud crítica y responsabilidad.
    temas:
      - "2.1. Análisis de procesos"
      - "2.1.1. Tipos de procesos"
      - "2.1.1.1. Claves"
      - "2.1.1.2. Estratégicos"
      - "2.1.1.3. De apoyo"
      - "2.2. Modelado de procesos"
      - "2.2.1. Notación de modelado de procesos (BPMN)"
      - "2.2.2. Características"
      - "2.2.3. Elementos de los diagramas"
      - "2.2.4. Objetos de flujo"
      - "2.2.4.1. Eventos"
      - "2.2.4.2. Actividad (procesos, subprocesos)"
      - "2.2.4.3. Gateway"
      - "2.2.4.4. Relaciones (objetos conector)"
      - "2.2.5. Documentación de procesos"
      - "2.3. Diagrama de comportamiento (funcionalidades)"
      - "2.3.1. Diagrama de casos de uso"
      - "2.3.2. Diagramas de interacción"
      - "2.3.3. Diagrama de secuencia"

  - numero: "III"
    nombre: "Análisis y modelado de datos"
    duracion_horas: 12
    competencia: >-
      Analizar la información de un sistema, mediante técnicas de extracción, transformación y carga (ETL) de las estructura de
      datos, para desarrollar el modelo de datos que cumplen con los requerimientos especificados, con actitud crítica, objetiva y
      responsable.
    temas:
      - "3.1. Análisis de datos"
      - "3.1.1. Fundamentos al Data Warehouse"
      - "3.1.1.1. Extracción"
      - "3.1.1.2. Limpieza"
      - "3.1.1.3. Conformación"
      - "3.1.1.4. Entrega"
      - "3.2. Técnicas ETL"
      - "3.2.1. Identificación de procesos en sistemas"
      - "3.2.2. Extracción (Análisis de datos extraídos)"
      - "3.2.3. Transformación"
      - "3.3.4. Carga"
      - "3.3. Estructuras de datos en un sistema"
      - "3.3.1. Archivos planos (Flat Files)"
      - "3.3.2. Repositorio de archivos XML"
      - "3.3.3. Bases de datos relacionales"
      - "3.3.4. Metadatos"
      - "3.4. Modelado de datos"
      - "3.4.1. Tipos de modelado de datos"
      - "3.4.1.1. Modelo conceptual."
      - "3.4.1.2. Modelo lógico."
      - "3.4.1.3. Modelo físico."
      - "3.5. Diagramación de modelado de datos"
      - "3.6. Diccionario de datos"
      - "3.6.1. Definición de los flujos de datos"
      - "3.6.2. Descripción de los flujos de datos"
      - "3.6.3. Creación de diccionario de diccionario de datos"
      - "3.6.4. Documentación de diccionarios de datos"

  - numero: "IV"
    nombre: "Análisis de decisiones"
    duracion_horas: 4
    competencia: >-
      Examinar el proceso de operación, mediante las etapas y técnicas del análisis de decisiones, para determinar las acciones a
      seguir ante una serie de alternativas, actitud crítica, asertiva, profesional.
    temas:
      - "4.1. Análisis de decisiones."
      - "4.1.1. Etapas del análisis de decisiones"
      - "4.1.2. Técnicas de análisis de decisiones"
      - "4.1.3. Árboles de decisiones"
      - "4.1.4. Tablas de decisión"
      - "4.2. Análisis de iteraciones o ciclos"
      - "4.2.1. Pseudocódigo o español estructurado"

