profesor: ara

# Copiado literalmente del PUA §I. Regla del CIAD: no se parafrasea.
identificacion:
  nombre: "Big Data"
  modalidad: semipresencial
  nivel_academico: "Licenciatura."
  programa_educativo: "Licenciado en Inteligencia de Negocios."
  plan_estudios: "2021-2."
  creditos_texto: "6 créditos (HC:1 HL:4 HE:1), 96 horas en el semestre."
  etapa_formativa: "Disciplinaria."
  caracter: "Obligatoria."
  practica: true          # eminentemente práctica → activa la nota del Art. 74

contenido:
  # Literal del PUA §III.
  competencia_general: >-
    Gestionar datos masivos mediante la aplicación de herramientas y estrategias de Big Data,
    para agilizar y optimizar el proceso de toma de decisiones en organizaciones, con
    honestidad, confidencialidad y pensamiento crítico.

  # PUA §II más un párrafo de contextualización, como en el ejemplo 961.
  proposito_general: >-
    La unidad de aprendizaje Big Data tiene el propósito de dotar al estudiante con los
    conocimientos y habilidades para el procesamiento y el análisis de datos masivos, haciendo
    uso de las herramientas tecnológicas, para la solución de problemas, que apoye en la toma de
    decisiones de las organizaciones.

    Esta asignatura se imparte en la etapa disciplinaria con carácter obligatorio y pertenece al
    área de conocimiento Ciencia de Datos del programa de Licenciado en Inteligencia de Negocios.
    Es eminentemente práctica y se orienta al desarrollo de competencias en el manejo de datos
    masivos mediante herramientas especializadas como Jupyter Notebook, Pyspark, Hadoop y
    técnicas de minería y visualización de datos.

  estrategia_general: >-
    Se utiliza el método de aprendizaje basado en prácticas de laboratorio, investigación
    documental, resolución de casos prácticos y trabajo por proyectos. El curso opera en
    modalidad semipresencial: se conduce en sesiones presenciales de laboratorio y mediante la
    plataforma institucional Blackboard, donde el aprendizaje se lleva a cabo por actividades
    sincrónicas (clases y laboratorios) y asincrónicas (tareas, reportes de práctica, foros de
    discusión y portafolio de evidencias). El docente presenta ejercicios prácticos, dirige las
    prácticas de laboratorio y muestra el uso de software especializado, propiciando la
    participación activa del estudiante.

  # Literal del PUA §IV.
  evidencias_desempeno: >-
    Portafolio de prácticas sobre la aplicación de las herramientas para el análisis de los datos
    masivos que ofrece el Big Data. En cada unidad se especifican las metas y sus requisitos, y en
    cada meta se especifica el producto que se debe entregar para que el alumno aplique lo
    aprendido.

  criterios_evaluacion: >-
    Cada meta contiene los criterios específicos conforme a los cuales será evaluado el
    estudiante. Estos criterios se presentan como requisitos para acreditar la meta o práctica y
    como evidencias de desempeño de cada unidad.

  autores_pua: >-
    Roberto Carlos Valdés Hernández, Myriam Gabriela Aguilera Zertuche, Héctor Zatarain Aceves,
    Eduardo Ahumada Tello. 10 de marzo de 2021.

# PUA §V. Los temas se copian literales, con sus defectos de numeración de origen.
unidades:
  - numero: "I"
    nombre: "Fundamentos de Big Data"
    duracion_horas: 4
    competencia: >-
      Identificar los fundamentos del Big Data, mediante la revisión de sus modelos y estructura,
      para comprender su aplicación en el manejo de datos de las organizaciones, con pensamiento
      analítico y reflexivo.
    temas:
      - "1.1. Conceptos de Big Data"
      - "1.2. Características del Big Data"
      - "1.3. Casos de estudio de Big Data"
      - "1.2. Introducción al reconocimiento de patrones"
      - "1.3. Modelos de regresión lineal y regresión logística"
      - "1.4. Exploración de la estructura de datos"
      - "1.5. Introducción a Jupyter Notebook y Pyspark"

  - numero: "II"
    nombre: "Data warehouse"
    duracion_horas: 4
    competencia: >-
      Analizar datos masivos mediante la aplicación del Data warehouse, con la finalidad de
      generar información de utilidad para la toma de decisiones estratégica, con pensamiento
      analítico, reflexivo y honestidad.
    temas:
      - "2.1. Concepto de Data warehouse"
      - "2.2. Características de un Data warehouse"
      - "2.2.1. Data Marts"
      - "2.3. Diseño de Data warehouse"
      - "2.4. Data warehouse basado en la nube"
      - "2.4.1. Solución analítica integrada"
      - "2.5. Premisas del Data warehouse"
      - "2.6. Inteligencia de negocios (Business Intelligence)"
      - "2.7. Analítica de datos en tiempo real (Tracking de datos)"

  - numero: "III"
    nombre: "Herramientas y Arquitecturas de Datawarehouse"
    duracion_horas: 4
    competencia: >-
      Aplicar las herramientas y arquitectura del Data warehouse, para el análisis de datos
      masivos, que apoye la toma de decisiones estratégica, con pensamiento analítico, reflexivo
      y honestidad.
    temas:
      - "3.1. Redes sociales (facebook graph)"
      - "3.2. Google trends"
      - "3.3. Operational Data Store"
      - "3.4. Sistemas de procesamiento analítico en línea"
      - "3.4.1 OLAP (Online Analytical Processing)"
      - "3.4.2 OLTP (Online Transaction Processing)"
      - "3.4.3 ROLAP (Relational Online Analytical Processing)"
      - "3.4.4 HOLAP (Hybrid Online Analytical Processing)"
      - "3.5. Selección de plataformas analíticas."
      - "3.6. HDFS (Hadoop Distributed File System) Architecture"
      - "3.6.1. HDFS Usage Examples"

  - numero: "IV"
    nombre: "Minería de datos"
    duracion_horas: 4
    competencia: >-
      Aplicar la Minería de datos, mediante el uso de herramientas y algoritmos, para generar
      información objetiva, que apoye la toma de decisiones en las organizaciones, con
      pensamiento crítico y honestidad.
    # El PUA repite la numeración 4.6 en «Evaluación de datos» y «Técnicas de minería de datos»;
    # se citan literales, con su defecto.
    temas:
      - "4.1. Introducción a minería de datos"
      - "4.2. Herramientas de minería de datos"
      - "4.3. Exploración de datos"
      - "4.4. Preprocesamiento de datos"
      - "4.5. Clasificación de datos"
      - "4.6. Evaluación de datos"
      - "4.6. Técnicas de minería de datos"
      - "4.6.1. Naive Bayes"
      - "4.6.2. K-medias"
      - "4.6.3. Redes Neuronales"
      - "4.6.4. Modelización con redes neuronales"
      - "4.6.5. Clasificación automática"
      - "4.6.6. Reducción dimensión"
      - "4.7. Análisis de componentes principales"
      - "4.8. Análisis exploratorio"

  - numero: "V"
    nombre: "Visualización de datos"
    duracion_horas: 4
    competencia: >-
      Representar el comportamiento de los datos masivos, mediante la comparación de diferentes
      gráficas y diagramas, que permita su visualización e interpretación, con pensamiento
      analítico y honestidad.
    temas:
      - "5.1. Gráfica de Barras"
      - "5.2. Gráfica de pastel"
      - "5.3. Diagrama de Caja"
      - "5.4. Diagrama de dispersión"
      - "5.5. Gráfica de Mapa"
      - "5.6. Diagrama de Grafo"
      - "5.7. Mapa de calor con agrupamiento"
      - "5.8. Diagramas de cuadrícula"
      - "5.8.1. Cuadrícula de Par (Pair Grid)"
      - "5.8.2. Cuadrícula de Facetas (Facet Grid)"

