# Diseño Instruccional — Contabilidad Financiera, ciclo 2026-2.
#
# RECONSTRUCCIÓN, no un curso nuevo. El contenido sale del DI que la docente ya entregó
# —`conocimiento/ejemplos/531-contabilidad-financiera-2026-1.md`, espejo del .docx de
# `ejemplos/`— y sirve para ver cómo queda su curso pasado por el generador.
#
# Tres cosas que NO son como en su documento original, y por qué:
#
#   1. Ciclo 2026-2, no 2026-1. Solo existe `calendarios/2026-2.yaml`; el suyo ya pasó.
#      Las fechas, por tanto, son las de agosto-noviembre y no las de su enero-junio.
#   2. Los tres exámenes son metas propias. En su DI viven dentro de la actividad de la
#      meta de esa semana; así trazados, la regla R3 —que cuenta metas de tipo
#      `examen_parcial`— encontraría cero y el curso no validaría.
#   3. Los valores van en porcentaje, no en puntos. Su rubro de actividades declara 150
#      puntos pero solo hay catorce metas de diez: son 140. No se reproduce el defecto
#      (R2 existe para atraparlo), así que el 30 % se reparte entre las catorce reales.
#
# Falta el PUA 38985: no está ingerido. Sin él no hay `pua_ref` ni temas por unidad.

meta:
  ciclo: "2026-2"
  clave: "38985"
  pua_ref: ""           # el PUA 38985 no está en puas/INDICE.md
  pua_sha256: ""

profesor: zra

identificacion:
  nombre: "Contabilidad Financiera"
  modalidad: semipresencial
  nivel_academico: "Licenciatura."
  programa_educativo: "Licenciatura en Contaduría."
  plan_estudios: "2021-2."
  creditos_texto: "8 créditos (HC:2 HT:4 HE:2), 128 horas en el semestre."
  etapa_formativa: "Básica."
  caracter: "Obligatoria."
  practica: false       # tiene taller (HT), no laboratorio: no aplica la nota del Art. 74

contenido:
  competencia_general: >-
    Formular los estados financieros y sus notas, a partir de la balanza de comprobación, la
    técnica, normatividad contable y operaciones especiales, para posibilitar su análisis e
    interpretación y permitir una mejor toma de decisiones en los negocios, con honestidad,
    responsabilidad y objetividad.

  proposito_general: >-
    La unidad de aprendizaje Contabilidad Financiera da continuidad a los conocimientos sobre
    registro de operaciones utilizando diferentes procedimientos y métodos de registro que le
    permiten al alumno formular los estados financieros y sus notas.

    Se imparte en la etapa básica con carácter obligatorio. El curso opera en modalidad
    semipresencial: las sesiones presenciales se dedican al planteamiento y la resolución
    acompañada de los registros contables, y el trabajo asincrónico en la plataforma
    institucional a completarlos, documentarlos y entregarlos.

  estrategia_general: >-
    En este curso se manejan conceptos básicos de la contabilidad mediante la exposición de temas
    teóricos acompañados de ejemplos. En forma sincrónica y asincrónica se dejarán tareas de
    investigación documental y ejercicios prácticos que el estudiante resuelve en clase y termina
    fuera de ella, integrándolos progresivamente al trabajo final del curso.

  evidencias_desempeno: >-
    Solución de un caso mediante la formulación de los estados financieros y sus notas conforme
    con la normatividad y técnica contable. El reporte debe integrar el registro de operaciones en
    libro diario y mayor, la hoja de trabajo, los auxiliares que correspondan y los estados
    financieros con sus notas explicativas.

  criterios_evaluacion: >-
    Cada una de las metas contiene los criterios específicos conforme a los cuales será evaluado
    el estudiante. Estos criterios se presentan en la forma de requisitos para acreditar la meta
    —características y condiciones de forma y tiempo de los entregables— y de evidencias de
    desempeño en cada unidad. Cada meta tiene un valor en el conjunto de la calificación.

  autores_pua: >-
    Dra. Zurisaddai Rubio Arriaga, enero de 2026.

# Del DI original: las competencias son literales. Los temas no se declaran porque salen de
# la §V del PUA y el PUA 38985 todavía no se ingiere.
unidades:
  - numero: "1"
    nombre: "Fórmulas de asignación de costos"
    competencia: >-
      Formular los estados financieros y sus notas, a partir de la balanza de comprobación, la
      técnica, normatividad contable y operaciones especiales, para posibilitar su análisis e
      interpretación y permitir una mejor toma de decisiones en los negocios, con honestidad,
      responsabilidad y objetividad.

  - numero: "2"
    nombre: "Operaciones especiales"
    competencia: >-
      Elaborar registros contables pertinentes, mediante la aplicación de las operaciones
      especiales, con la finalidad de presentar la información y resultados de operación, con
      responsabilidad y pensamiento crítico.

  - numero: "3"
    nombre: "Ajustes"
    competencia: >-
      Identificar las cuentas sujetas a ajustes por lo procedimientos de registro de inventario
      perpetuo y analítico, a través de la normatividad contable, para realizar los registros que
      permitan obtener información financiera razonable a los usuarios, con imparcialidad y
      actitud analítica.

  - numero: "4"
    nombre: "Elaboración de la hoja de trabajo"
    competencia: >-
      Elaborar la hoja de trabajo, a partir de la balanza de comprobación y la incorporación de
      los ajustes, para la confección de los estados financieros, de manera responsable y
      ordenada.

  - numero: "5"
    nombre: "Cuentas de orden"
    competencia: >-
      Identificar la aplicación de las cuentas de orden en los registros contables, mediante el
      análisis de las características específicas de control, para registrar y presentar las
      operaciones realizadas por la entidad, con precisión y veracidad.

  - numero: "6"
    nombre: "Estados financieros"
    competencia: >-
      Elaborar un paquete de información financiera, a partir de la hoja de trabajo, con el fin de
      proporcionar información útil para la toma de decisiones, con profesionalismo, oportunidad y
      veracidad.

