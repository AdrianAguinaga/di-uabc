# Copiado literalmente del PUA §I. Regla del CIAD: no se parafrasea.
identificacion:
  nombre: "Patrones de Comportamiento de Datos"
  modalidad: semipresencial
  nivel_academico: "Licenciatura."
  programa_educativo: "Licenciado en Inteligencia de Negocios."
  plan_estudios: "2021-2."
  creditos_texto: "6 créditos (HC:2 HT:0 HL:2 HE:2), 96 horas en el semestre."
  etapa_formativa: "Terminal."
  caracter: "Obligatoria."
  practica: true          # 9 prácticas de laboratorio → activa la nota del Art. 74

contenido:
  # Literal del PUA §III.
  competencia_general: >-
    Desarrollar el proceso general del descubrimiento de conocimiento en datos, mediante las
    herramientas de vanguardia, que permitan identificar patrones ocultos en los datos para la
    toma de decisiones, con honestidad, actitud analítica y propositiva.

  # PUA §II más un párrafo de contextualización, como en el ejemplo 961.
  proposito_general: >-
    La unidad de aprendizaje proporciona el proceso general y las herramientas para el
    descubrimiento de conocimiento en datos, lo que permite identificar patrones ocultos en los
    datos para apoyar la toma de decisiones. Se imparte en la etapa terminal con carácter
    obligatorio y pertenece al área de conocimiento de Ciencia de Datos.

    Al ubicarse en la etapa terminal, la asignatura supone que el estudiante ya maneja el
    tratamiento de datos masivos y se concentra en descubrir estructura donde a simple vista no
    la hay: redes complejas, fenómenos de escalamiento y comportamiento caótico. El curso opera
    en modalidad semipresencial, con sesiones presenciales de laboratorio y trabajo asincrónico
    en la plataforma institucional Blackboard.

  estrategia_general: >-
    Se utiliza el método de aprendizaje basado en prácticas de laboratorio, análisis de casos y
    trabajo por proyectos. El curso opera en modalidad semipresencial: se conduce en sesiones
    presenciales de laboratorio y mediante la plataforma institucional Blackboard, donde el
    aprendizaje se lleva a cabo por actividades sincrónicas (clases y laboratorios) y
    asincrónicas (tareas, reportes de práctica, foros de discusión y avances del proyecto). El
    docente presenta los fundamentos, dirige las nueve prácticas de laboratorio y acompaña el
    desarrollo del caso de estudio que integra el curso.

  # Literal del PUA §IV.
  evidencias_desempeno: >-
    Un proyecto que incluya un caso de estudio de la aplicación de las herramientas de
    descubrimiento e interpretación de patrones. Debe presentarse un reporte técnico que
    documente el proyecto y una exposición del mismo.

  criterios_evaluacion: >-
    Cada meta contiene los criterios específicos conforme a los cuales será evaluado el
    estudiante. Estos criterios se presentan como requisitos para acreditar la meta o práctica y
    como evidencias de desempeño de cada unidad.

  autores_pua: >-
    Karina Caro Corrales, Francisco Flores Resendiz, Karina Raya Diaz, Jesús Antonio Padilla
    Sánchez. 12 de noviembre de 2020.

# PUA §V. Los temas se copian literales, con sus defectos de numeración de origen.
unidades:
  - numero: "I"
    nombre: "Fundamentos de patrones de comportamiento de datos"
    duracion_horas: 4
    competencia: >-
      Distinguir los fundamentos de patrones de comportamiento de datos, mediante la revisión de
      su clasificación y comportamiento, para entender el proceso general de descubrimiento de
      los mismos, con actitud analítica y reflexiva.
    temas:
      - "1.1. Antecedentes de los patrones de comportamiento"
      - "1.2. Comportamiento emergente"
      - "1.2.1. Formación de un patrón"
      - "1.2.1.1. Patrones conectados"
      - "1.2.1.2. Patrones no conectados"
      - "1.3. Clasificación de patrones de comportamiento"

  - numero: "II"
    nombre: "Proceso de descubrimiento del conocimiento en datos (KDD)"
    duracion_horas: 6
    competencia: >-
      Aplicar el proceso de descubrimiento del conocimiento en datos, a través de la examinación
      de sus fases, con la finalidad de identificar e interpretar patrones en los datos, con
      confidencialidad y actitud analítica.
    temas:
      - "2.1. Selección de datos"
      - "2.2. Preprocesamiento"
      - "2.3. Transformación"
      - "2.4. Minería de datos"
      - "2.5. Interpretación"

  - numero: "III"
    nombre: "Patrones de comportamiento basados en redes complejas"
    duracion_horas: 8
    competencia: >-
      Distinguir los patrones de comportamiento basados en redes complejas, a través del análisis
      de sus tipos y métricas, para identificar su proceso de aplicación, con una actitud
      analítica, crítica y organizada.
    temas:
      - "3.1. Matriz de adyacencia"
      - "3.2. Grafos dirigidos y no dirigidos"
      - "3.3. Árboles de decisiones"
      - "3.4. Métricas de redes complejas"
      - "3.4.1. Intermediación"
      - "3.4.2. Grado de agrupamiento"

  - numero: "IV"
    nombre: "Patrones de comportamiento basados en escalamiento"
    duracion_horas: 8
    competencia: >-
      Distinguir los patrones de comportamiento basados en escalamiento, a través del análisis de
      sus tipos, para identificar su proceso de aplicación, con una actitud analítica, crítica y
      organizada.
    temas:
      - "4.1. Fractales"
      - "4.1.1. Ley de potencias"
      - "4.1.2. Frecuencia de rango"
      - "4.2. Patrones de comportamiento Caótico"
      - "4.2.1. Bifurcaciones"
      - "4.2.2. Efecto mariposa"
      - "4.2.3. Atractores extraños"
      - "4.3. Autoorganización"

  - numero: "V"
    nombre: "Herramientas para la toma decisiones basada en patrones y sus aplicaciones"
    duracion_horas: 6
    competencia: >-
      Aplicar el proceso de descubrimiento del conocimiento en datos, a través del uso de las
      herramientas de vanguardia, para identificar diferentes tipos de patrones ocultos en los
      datos en sus distintas áreas de aplicación, con actitud propositiva, lógica y colaborativa.
    temas:
      - "5.1. Herramientas para el descubrimiento de patrones de datos"
      - "5.1.1. Netlogo"
      - "5.1.2. IBM Watson Studio"
      - "5.1.3. R Studio"
      - "5.1.4. Python NetworkX"
      - "5.1.5. Otras"
      - "5.2. Casos de estudio de descubrimiento de patrones de datos"
      - "5.2.1. Finanzas"
      - "5.2.2. Redes sociales"
      - "5.2.3. Ciencias de la salud"
      - "5.2.4. Otros"

