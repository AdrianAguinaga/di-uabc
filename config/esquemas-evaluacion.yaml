# Esquemas de evaluación disponibles.
#
# Fundamento legal (Estatuto Escolar UABC, reforma 20 may 2021):
#   Art. 67 — los criterios deben definir los aspectos a evaluar y sus porcentajes.
#   Art. 68 — mínimo DOS exámenes parciales por periodo escolar. La exención del
#             ordinario la decide el profesor; el alumno inconforme puede exigirlo.
#   Art. 65 — escala 0 a 100, mínima aprobatoria 60 en licenciatura.
#
# El umbral de exención es criterio del docente amparado en el Art. 68. Los formatos
# institucionales recomiendan 90, pero no lo imponen. Se declara como criterio del
# docente, nunca como norma universitaria.

predeterminado: estandar-2026

esquemas:
  estandar-2026:
    nombre: "Estándar 2026"
    descripcion: "Exámenes 20 · Tareas y actividades 40 · Proyecto final 40"
    rubros:
      - id: examenes
        etiqueta: "Exámenes"
        porcentaje: 20
        detalle: "Dos evaluaciones parciales de 10 % cada una"
        parciales: 2
      - id: tareas
        etiqueta: "Tareas y actividades de clase"
        porcentaje: 40
      - id: proyecto
        etiqueta: "Proyecto final"
        porcentaje: 40
    exencion_ordinario: 80

  pua-39062:
    nombre: "Patrones de Comportamiento de Datos (§VIII del PUA)"
    descripcion: "Parciales 20 · Tareas 10 · Prácticas de laboratorio 30 · Proyecto 40"
    # Lo dicta la §VIII del PUA 39062. No se toma del catálogo general porque el programa
    # oficial ya fijó los porcentajes: frente a un alumno inconforme, la defensa es el PUA.
    rubros:
      - id: examenes
        etiqueta: "Evaluaciones parciales"
        porcentaje: 20
        detalle: "Dos evaluaciones parciales de 10 % cada una"
        parciales: 2
      - id: tareas
        etiqueta: "Tareas"
        porcentaje: 10
      # `detalle` se imprime en el documento: se redacta para el alumno, sin la
      # taquigrafía de secciones que se usa en los comentarios y en AGENTS.md.
      - id: practicas
        etiqueta: "Prácticas de laboratorio"
        porcentaje: 30
        detalle: "nueve prácticas de laboratorio con su reporte"
      - id: proyecto
        etiqueta: "Proyecto"
        porcentaje: 40
        detalle: "caso de estudio, reporte técnico y exposición"
    exencion_ordinario: 80

  zra-contabilidad:
    nombre: "Contabilidad Financiera (esquema de Zurisaddai Rubio)"
    descripcion: "Actividades 30 · Exámenes parciales 50 · Trabajo final 20"
    # Tomado de la primera tabla de su DI 2026-1. Dos rasgos suyos: los exámenes pesan la
    # mitad de la calificación, y el trabajo final es además requisito de acreditación
    # —sin entregarlo completo, la máxima es 50—, criterio que vive en politicas.yaml.
    #
    # Su documento reparte las actividades en puntos (10 por meta, 150 declarados) y añade
    # un segundo nivel: el promedio vale 60 % y el examen ordinario 40 %. Desde la Fase 11 el
    # modelo lo declara aquí abajo, con los rótulos literales de su DI —capitalización
    # irregular incluida, para que el contraste de R1 coincida—; ver
    # conocimiento/ejemplos/531-contabilidad-financiera-2026-1.md.
    rubros:
      - id: actividades
        etiqueta: "Entrega de actividades en clases y tareas"
        porcentaje: 30
      - id: examenes
        etiqueta: "Exámenes parciales"
        porcentaje: 50
        detalle: "tres exámenes: 15 %, 15 % y 20 %"
        parciales: 3
      - id: trabajo_final
        etiqueta: "Trabajo final completo"
        porcentaje: 20
        detalle: "conforme a los requisitos de forma y fondo de la rúbrica"
    segundo_nivel:
      promedio:
        porcentaje: 60
        etiqueta: "Valor del promedio antes del Examen Ordinario"
      ordinario:
        porcentaje: 40
        etiqueta: "Valor del examen Ordinario"
    exencion_ordinario: 90

  practica-laboratorio:
    nombre: "Práctica de laboratorio"
    descripcion: "Para unidades de aprendizaje eminentemente prácticas"
    rubros:
      - id: examenes
        etiqueta: "Evaluaciones parciales"
        porcentaje: 20
        parciales: 2
      - id: practicas
        etiqueta: "Prácticas de laboratorio"
        porcentaje: 45
      - id: tareas
        etiqueta: "Tareas e investigaciones"
        porcentaje: 15
      - id: portafolio
        etiqueta: "Portafolio de prácticas"
        porcentaje: 20
    exencion_ordinario: 80

# Reglas que la validación aplica a cualquier esquema, incluidos los capturados a mano.
reglas:
  suma_exacta: 100
  parciales_minimos: 2          # Art. 68
  exencion_minima: 60           # no puede ser menor que la calificación aprobatoria (Art. 65)
  exencion_maxima: 100
