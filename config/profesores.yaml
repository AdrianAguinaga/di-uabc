# Profesores para los que se emiten diseños instruccionales.
# El `id` es lo que se guarda en curso.yaml; el nombre se copia tal cual al documento,
# con el título incluido si así firma la persona.
#
# `exencion_predeterminada` es el umbral que el profesor suele fijar; el `curso.yaml`
# puede sobrescribirlo. No es norma universitaria: el Art. 68 deja la exención a
# criterio del docente. Las políticas de acreditación propias de cada quien viven en
# `politicas.yaml`, filtradas con `profesores:`.

